<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caja bajo Control – FEBOR</title>
<meta name="description" content="Caja bajo Control: plataforma de capacitación en manejo de efectivo de FEBOR Entidad Cooperativa. Elaborado por Milena Velásquez, Tesorera.">
<!-- Tipografías: Sora (títulos, gruesa y redondeada) y Nunito (texto, redondeada y legible en proyección) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
/* =========================================================================
   1. VARIABLES DE DISEÑO (identidad visual tomada del tablero
      "Indicadores Financieros FEBOR")
   ========================================================================= */
:root{
  --bg:#f3f5f8;
  --bg-2:#eef1f5;
  --surface:#ffffff;
  --ink:#1c2620;          /* títulos: casi negro verdoso, como el tablero */
  --ink-2:#4a5560;        /* texto */
  --ink-3:#7b8794;        /* texto secundario */
  --accent:#3b4cb8;       /* azul-índigo de subtítulos ("Tablero de Indicadores") */
  --accent-bar:#16c784;   /* barra verde junto al título principal */
  --line:#e3e8ee;

  /* Degradados de tarjetas */
  --g-turq:linear-gradient(135deg,#1ad5c4 0%,#00a596 55%,#008277 100%);
  --g-blue:linear-gradient(135deg,#03a9ea 0%,#0283c4 55%,#005d8f 100%);
  --g-purp:linear-gradient(135deg,#995fce 0%,#70409e 55%,#48236c 100%);
  --g-green:linear-gradient(135deg,#00cf6a 0%,#00a752 55%,#007f37 100%);
  --g-orng:linear-gradient(135deg,#faa662 0%,#e07a4a 55%,#c44f34 100%);
  --g-indg:linear-gradient(135deg,#00d5c2 0%,#00b8c9 50%,#009bd0 100%);
  --g-final:linear-gradient(100deg,#00d5c2 0%,#00b8c9 50%,#009bd0 100%);

  --c-turq:#00a596; --c-blue:#0283c4; --c-purp:#70409e;
  --c-green:#00a752; --c-orng:#e07a4a; --c-indg:#00a8cc;

  --ok:#12a150; --ok-bg:#e7f8ee;
  --bad:#d6453d; --bad-bg:#fdeceb;
  --warn:#c97a00; --warn-bg:#fff4dc;

  --radius-lg:22px; --radius:16px; --radius-sm:11px;
  --shadow-sm:0 2px 8px rgba(20,40,60,.06);
  --shadow:0 10px 30px rgba(20,40,60,.10);
  --shadow-lg:0 18px 50px rgba(20,40,60,.16);

  --font-title:'Sora','Segoe UI',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;

  --sidebar-w:290px;
  --topbar-h:78px;
}

/* Modo proyección: agranda toda la interfaz para salas y videobeam */
html.proyeccion{ font-size:118%; }
html{ font-size:100%; scroll-behavior:smooth; }
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:var(--font-body); color:var(--ink-2); background:var(--bg);
  line-height:1.6; min-height:100vh; -webkit-font-smoothing:antialiased;
  /* Fondo con transparencias geométricas suaves */
  background-image:
    radial-gradient(circle at 92% 8%, rgba(25,211,181,.08) 0, transparent 28%),
    radial-gradient(circle at 4% 92%, rgba(164,94,224,.07) 0, transparent 30%),
    radial-gradient(circle at 60% 110%, rgba(34,170,240,.06) 0, transparent 35%);
  background-attachment:fixed;
}
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
a{ color:inherit; }
h1,h2,h3,h4{ font-family:var(--font-title); color:var(--ink); line-height:1.2; letter-spacing:-.02em; }
:focus-visible{ outline:3px solid #22aaf0; outline-offset:3px; border-radius:6px; }

/* =========================================================================
   2. BARRA SUPERIOR (logo, título, progreso general)
   ========================================================================= */
.topbar{
  position:sticky; top:0; z-index:50; height:var(--topbar-h);
  display:flex; align-items:center; gap:22px; padding:0 26px;
  background:rgba(255,255,255,.88); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line); box-shadow:var(--shadow-sm);
}
.brand{ display:flex; align-items:center; gap:14px; text-decoration:none; flex-shrink:0; }
.brand img{ height:54px; width:auto; display:block; }
.brand-name{ font-family:var(--font-title); font-weight:800; font-size:1.05rem; color:var(--ink); line-height:1.1; }
.brand-name small{ display:block; font-family:var(--font-body); font-weight:700; font-size:.72rem; color:var(--ink-3); letter-spacing:.08em; text-transform:uppercase; }
.brand-sep{ width:1px; height:36px; background:var(--line); }

.progress-wrap{ flex:1; max-width:520px; margin-left:auto; }
.progress-label{ display:flex; justify-content:space-between; font-size:.8rem; font-weight:800; color:var(--ink-3); margin-bottom:6px; letter-spacing:.02em; }
.progress-label b{ color:var(--accent); }
.progress{ height:12px; border-radius:99px; background:var(--bg-2); overflow:hidden; position:relative; }
.progress-fill{ height:100%; width:0; border-radius:99px; background:var(--g-final); transition:width .8s cubic-bezier(.2,.8,.2,1); position:relative; }
.progress-fill::after{ content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent); animation:shine 2.6s infinite; }
@keyframes shine{ from{transform:translateX(-100%)} to{transform:translateX(100%)} }
.progress-dots{ display:flex; gap:6px; margin-top:7px; }
.progress-dots span{ flex:1; height:5px; border-radius:9px; background:var(--line); transition:background .4s; }
.progress-dots span.done{ background:var(--ok); }
.progress-dots span.current{ background:#22aaf0; }

.top-actions{ display:flex; gap:8px; }
.icon-btn{
  height:42px; padding:0 14px; border-radius:12px; display:inline-flex; align-items:center; gap:8px;
  font-weight:800; font-size:.82rem; color:var(--ink-2); background:var(--bg-2); transition:all .2s;
}
.icon-btn:hover{ background:#e2e7ee; color:var(--ink); }
.icon-btn svg{ width:18px; height:18px; }
.icon-btn.active{ background:var(--accent); color:#fff; }
.menu-toggle{ display:none; }

/* =========================================================================
   3. DISPOSICIÓN GENERAL: navegación lateral + contenido
   ========================================================================= */
.layout{ display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:calc(100vh - var(--topbar-h)); }
.sidebar{
  position:sticky; top:var(--topbar-h); height:calc(100vh - var(--topbar-h)); overflow-y:auto;
  padding:24px 16px; background:rgba(255,255,255,.6); border-right:1px solid var(--line);
}
.side-title{ font-size:.72rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); padding:0 12px; margin:6px 0 10px; }
.side-link{
  width:100%; display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:13px;
  text-align:left; font-weight:700; font-size:.92rem; color:var(--ink-2); transition:all .2s; margin-bottom:4px;
}
.side-link:hover:not(.locked){ background:#fff; box-shadow:var(--shadow-sm); color:var(--ink); }
.side-link.active{ background:#fff; box-shadow:var(--shadow); color:var(--ink); }
.side-link.locked{ opacity:.5; cursor:not-allowed; }
.side-ico{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:#fff; flex-shrink:0; }
.side-ico svg{ width:18px; height:18px; }
.side-txt{ flex:1; line-height:1.25; }
.side-txt small{ display:block; font-size:.72rem; font-weight:700; color:var(--ink-3); }
.side-state svg{ width:18px; height:18px; }
.side-state.ok{ color:var(--ok); }
.side-state.lock{ color:var(--ink-3); }
.side-divider{ height:1px; background:var(--line); margin:16px 8px; }
.side-legend{ margin:12px 8px 0; padding:14px; border-radius:14px; background:#fff; font-size:.78rem; box-shadow:var(--shadow-sm); }
.side-legend p{ display:flex; gap:8px; align-items:flex-start; margin-bottom:8px; line-height:1.35; }
.side-legend p:last-child{ margin-bottom:0; }
.dot{ width:12px; height:12px; border-radius:4px; flex-shrink:0; margin-top:2px; }

main:focus{ outline:none; }
main{ padding:36px clamp(18px,4vw,56px) 70px; min-width:0; }
.view{ animation:viewIn .5s cubic-bezier(.2,.8,.2,1); max-width:1280px; margin:0 auto; }
@keyframes viewIn{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }

/* =========================================================================
   4. TABLERO PRINCIPAL
   ========================================================================= */
.hero{ text-align:center; margin:4px 0 34px; }
.hero h1{ font-size:clamp(2rem,4.2vw,3.2rem); font-weight:800; display:inline-flex; align-items:center; gap:18px; }
.hero h1::before{ content:""; width:6px; height:.9em; border-radius:6px; background:var(--accent-bar); }
.hero p{ font-size:clamp(1rem,1.5vw,1.2rem); color:var(--ink-2); margin-top:10px; }
.hero .hero-meta{ display:inline-flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:18px; }
.chip{ display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:99px; background:#fff; font-size:.82rem; font-weight:800; color:var(--ink-2); box-shadow:var(--shadow-sm); }
.chip svg{ width:15px; height:15px; }
.chip b{ color:var(--accent); }

.cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
.mcard{
  position:relative; overflow:hidden; border-radius:var(--radius-lg); padding:24px 24px 22px; min-height:200px;
  color:#fff; text-align:left; display:flex; flex-direction:column; box-shadow:var(--shadow);
  transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s; isolation:isolate;
  animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes cardIn{ from{opacity:0; transform:translateY(22px) scale(.98)} to{opacity:1; transform:none} }
/* Elementos geométricos translúcidos dentro de cada tarjeta */
.mcard::before,.mcard::after{ content:""; position:absolute; border-radius:50%; background:rgba(255,255,255,.12); z-index:-1; transition:transform .6s; }
.mcard::before{ width:220px; height:220px; right:-70px; top:-90px; }
.mcard::after{ width:140px; height:140px; right:40px; bottom:-80px; background:rgba(255,255,255,.08); }
.mcard:hover:not(.locked){ transform:translateY(-6px); box-shadow:var(--shadow-lg); }
.mcard:hover:not(.locked)::before{ transform:scale(1.15); }
.mcard.locked{ cursor:not-allowed; opacity:.82; }
.mcard.locked .mcard-ico{ background:rgba(255,255,255,.18); }
.mcard-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; }
.mcard-ico{ width:48px; height:48px; border-radius:14px; display:grid; place-items:center; background:rgba(255,255,255,.22); backdrop-filter:blur(4px); }
.mcard-ico svg{ width:24px; height:24px; }
.badge{ padding:5px 12px; border-radius:99px; font-size:.68rem; font-weight:800; letter-spacing:.1em; background:rgba(255,255,255,.25); border:1px solid rgba(255,255,255,.35); display:inline-flex; align-items:center; gap:6px; }
.badge svg{ width:12px; height:12px; }
.badge.done{ background:#fff; color:var(--ok); border-color:#fff; }
.mcard-num{ font-family:var(--font-title); font-size:.78rem; font-weight:700; opacity:.85; letter-spacing:.08em; }
.mcard h3{ color:#fff; font-size:1.35rem; font-weight:800; margin:2px 0 6px; }
.mcard p{ font-size:.92rem; opacity:.92; line-height:1.45; flex:1; }
.mcard-cta{ margin-top:18px; font-family:var(--font-title); font-weight:700; font-size:.85rem; letter-spacing:.06em; display:inline-flex; align-items:center; gap:6px; }
.mcard-cta svg{ width:16px; height:16px; transition:transform .25s; }
.mcard:hover:not(.locked) .mcard-cta svg{ transform:translateX(4px); }

.section-head{ text-align:center; margin:52px 0 22px; }
.section-head h2{ font-size:clamp(1.5rem,2.6vw,2rem); color:var(--accent); font-weight:800; }
.section-head p{ color:var(--ink-3); font-weight:600; margin-top:6px; }
.section-head p b{ color:var(--accent); }

/* Tarjeta ancha del reto final (inspirada en la barra "Indicadores (%)") */
.final-card{
  position:relative; overflow:hidden; border-radius:var(--radius-lg); padding:26px 30px; display:flex; align-items:center; gap:22px;
  background:var(--g-final); color:#fff; box-shadow:var(--shadow); width:100%; text-align:left; transition:transform .3s, box-shadow .3s; isolation:isolate;
}
.final-card::before{ content:""; position:absolute; width:300px; height:300px; border-radius:50%; background:rgba(255,255,255,.1); right:10%; top:-150px; z-index:-1; }
.final-card::after{ content:""; position:absolute; width:180px; height:180px; transform:rotate(25deg); border-radius:30px; background:rgba(255,255,255,.08); right:-40px; bottom:-90px; z-index:-1; }
.final-card:hover:not(.locked){ transform:translateY(-4px); box-shadow:var(--shadow-lg); }
.final-card.locked{ cursor:not-allowed; opacity:.82; }
.final-ico{ width:62px; height:62px; border-radius:18px; display:grid; place-items:center; background:rgba(255,255,255,.22); flex-shrink:0; }
.final-ico svg{ width:30px; height:30px; }
.final-card h3{ color:#fff; font-size:1.45rem; font-weight:800; }
.final-card p{ opacity:.92; font-size:.95rem; }
.final-card .grow{ flex:1; }
.pill-btn{ padding:9px 18px; border-radius:99px; font-weight:800; font-size:.8rem; letter-spacing:.08em; background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.4); color:#fff; white-space:nowrap; display:inline-flex; align-items:center; gap:8px; }
.pill-btn svg{ width:16px; height:16px; }

.how{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:22px; }
.how-step{ background:#fff; border-radius:var(--radius); padding:20px; box-shadow:var(--shadow-sm); display:flex; gap:14px; align-items:flex-start; }
.how-n{ width:38px; height:38px; border-radius:12px; display:grid; place-items:center; font-family:var(--font-title); font-weight:800; color:#fff; flex-shrink:0; }
.how-step h4{ font-size:1rem; margin-bottom:3px; }
.how-step p{ font-size:.88rem; line-height:1.45; }

/* =========================================================================
   5. VISTA DE MÓDULO
   ========================================================================= */
.mod-banner{
  position:relative; overflow:hidden; border-radius:var(--radius-lg); padding:30px 34px; color:#fff; box-shadow:var(--shadow); isolation:isolate;
}
.mod-banner::before{ content:""; position:absolute; width:360px; height:360px; border-radius:50%; background:rgba(255,255,255,.1); right:-90px; top:-170px; z-index:-1; }
.mod-banner::after{ content:""; position:absolute; width:160px; height:160px; border-radius:36px; transform:rotate(30deg); background:rgba(255,255,255,.08); right:22%; bottom:-100px; z-index:-1; }
.back-link{ display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:.82rem; letter-spacing:.06em; padding:7px 14px 7px 10px; border-radius:99px; background:rgba(255,255,255,.2); margin-bottom:18px; transition:background .2s; }
.back-link:hover{ background:rgba(255,255,255,.32); }
.back-link svg{ width:16px; height:16px; }
.mod-banner .row{ display:flex; gap:20px; align-items:center; }
.mod-banner .mcard-ico{ width:64px; height:64px; border-radius:18px; }
.mod-banner .mcard-ico svg{ width:32px; height:32px; }
.mod-banner h1{ color:#fff; font-size:clamp(1.7rem,3.2vw,2.5rem); font-weight:800; }
.mod-banner p{ opacity:.92; font-size:1.02rem; }

.stepper{ display:flex; gap:10px; flex-wrap:wrap; margin:22px 0 18px; }
.step-chip{
  display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border-radius:99px; background:#fff; font-weight:800; font-size:.84rem;
  color:var(--ink-2); box-shadow:var(--shadow-sm); transition:all .25s; border:2px solid transparent;
}
.step-chip .n{ width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--bg-2); font-size:.72rem; }
.step-chip.visited .n{ background:var(--ok); color:#fff; }
.step-chip.current{ border-color:var(--mc,#22aaf0); color:var(--ink); box-shadow:var(--shadow); }
.step-chip.current .n{ background:var(--mc,#22aaf0); color:#fff; }
.step-chip:hover{ transform:translateY(-2px); }

.content-card{ background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:clamp(22px,3.4vw,44px); animation:viewIn .45s cubic-bezier(.2,.8,.2,1); }
.content-card > h2{ font-size:clamp(1.4rem,2.4vw,1.9rem); font-weight:800; margin-bottom:6px; display:flex; align-items:center; gap:12px; }
.content-card > h2::before{ content:""; width:6px; height:1em; border-radius:6px; background:var(--mc,#22aaf0); }
.content-card .kicker{ font-size:.78rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-bottom:22px; }
.content-card h3{ font-size:1.15rem; margin:26px 0 10px; }
.content-card p{ margin-bottom:12px; font-size:1.04rem; }

/* Bloques: recomendación complementaria y notas */
.manual{ position:relative; border-radius:var(--radius); background:#f8fafc; border:1px solid var(--line); padding:20px 22px 14px; margin:16px 0; }
.manual .tag,.extra .tag,.nota .tag,.visual .tag{
  display:inline-flex; align-items:center; gap:6px; font-size:.7rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  padding:4px 10px; border-radius:99px; margin-bottom:12px;
}
.manual .tag{ background:#e3f6f2; color:#0b7f74; }
.tag svg{ width:13px; height:13px; }
.manual ul,.extra ul,.visual ul{ list-style:none; }
.manual li,.extra li{ position:relative; padding-left:30px; margin-bottom:11px; font-size:1.02rem; }
.manual li::before{ content:""; position:absolute; left:6px; top:.55em; width:10px; height:10px; border-radius:3px; background:var(--mc,#0ea59a); transform:rotate(45deg); }
.manual .mark{ background:linear-gradient(transparent 55%, #ffe58a 55%); font-weight:800; }
.extra{ border-radius:var(--radius); border:2px dashed #c8b3ec; background:#faf6ff; padding:18px 22px 10px; margin:18px 0; }
.extra .tag{ background:#efe5ff; color:#6a35b0; }
.extra li::before{ content:"✦"; position:absolute; left:6px; color:#9b6ad8; }
.nota{ border-radius:var(--radius); background:var(--warn-bg); border-left:5px solid #f0a500; padding:16px 20px 8px; margin:16px 0; font-size:.95rem; }
.nota .tag{ background:#ffe7ad; color:#8a5600; }
.nota p{ font-size:.95rem !important; }
.visual{ border-radius:var(--radius); background:linear-gradient(135deg,#f2fbff,#f4f2ff); border:1px solid #dfe7f7; padding:20px 22px; margin:18px 0; }
.visual .tag{ background:#dfeafe; color:#2a4fb8; }

/* Componentes visuales de resumen */
.flow{ display:flex; flex-wrap:wrap; gap:10px; align-items:stretch; }
.flow-step{ flex:1 1 150px; background:#fff; border-radius:14px; padding:14px; box-shadow:var(--shadow-sm); position:relative; font-size:.9rem; font-weight:700; line-height:1.35; }
.flow-step b{ display:block; font-family:var(--font-title); color:var(--mc,#1668c9); font-size:.75rem; letter-spacing:.08em; margin-bottom:4px; }
.offices{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.office{ background:#fff; border-radius:16px; padding:18px; box-shadow:var(--shadow-sm); }
.office h4{ font-size:1.05rem; margin-bottom:10px; }
.office .base{ font-family:var(--font-title); font-size:1.7rem; font-weight:800; color:var(--ink); }
.office .base small{ font-size:.75rem; color:var(--ink-3); font-weight:700; display:block; letter-spacing:.06em; }
.range{ position:relative; height:12px; border-radius:99px; background:var(--bg-2); margin:14px 0 8px; }
.range .fill{ position:absolute; top:0; bottom:0; border-radius:99px; background:var(--g-green); }
.range .pin{ position:absolute; top:-5px; width:4px; height:22px; border-radius:4px; background:var(--ink); }
.range-lbl{ display:flex; justify-content:space-between; font-size:.78rem; font-weight:800; color:var(--ink-3); }
.kv{ display:grid; grid-template-columns:auto 1fr; gap:10px 16px; background:#fff; border-radius:14px; padding:16px 18px; box-shadow:var(--shadow-sm); }
.kv dt{ font-weight:800; color:var(--ink); }
.kv dd{ color:var(--ink-2); }
.numlist{ counter-reset:n; list-style:none; display:grid; gap:10px; }
.numlist li{ counter-increment:n; display:flex; align-items:center; gap:14px; background:#fff; border-radius:14px; padding:12px 16px; box-shadow:var(--shadow-sm); font-weight:700; }
.numlist li::before{ content:counter(n); width:32px; height:32px; border-radius:10px; display:grid; place-items:center; color:#fff; background:var(--mc,#1668c9); font-family:var(--font-title); font-weight:800; flex-shrink:0; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.grid2{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
.mini{ background:#fff; border-radius:16px; padding:18px; box-shadow:var(--shadow-sm); }
.mini .mi{ width:44px; height:44px; border-radius:13px; display:grid; place-items:center; color:#fff; margin-bottom:12px; }
.mini .mi svg{ width:22px; height:22px; }
.mini h4{ font-size:1rem; margin-bottom:8px; }
.mini ul{ list-style:none; }
.mini li{ font-size:.92rem; padding-left:18px; position:relative; margin-bottom:6px; line-height:1.4; }
.mini li::before{ content:""; position:absolute; left:2px; top:.55em; width:7px; height:7px; border-radius:50%; background:var(--mc,#e8613a); }
.big-msg{ text-align:center; padding:22px; border-radius:18px; background:var(--g-orng); color:#fff; font-family:var(--font-title); font-weight:800; font-size:clamp(1.2rem,2.2vw,1.6rem); margin:8px 0 18px; box-shadow:var(--shadow); }

/* Navegación inferior del módulo */
.mod-nav{ display:flex; justify-content:space-between; align-items:center; gap:14px; margin-top:26px; flex-wrap:wrap; }
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:9px; padding:14px 24px; border-radius:14px;
  font-family:var(--font-title); font-weight:700; font-size:.95rem; transition:all .22s; letter-spacing:.01em;
}
.btn svg{ width:18px; height:18px; }
.btn-ghost{ background:#fff; color:var(--ink-2); box-shadow:var(--shadow-sm); }
.btn-ghost:hover{ color:var(--ink); box-shadow:var(--shadow); }
.btn-primary{ color:#fff; background:var(--mbg,var(--g-blue)); box-shadow:0 8px 22px rgba(22,104,201,.28); }
.btn-primary:hover{ transform:translateY(-2px); filter:brightness(1.05); }
.btn-ok{ color:#fff; background:var(--g-green); box-shadow:0 8px 22px rgba(18,161,80,.3); }
.btn-ok:hover{ transform:translateY(-2px); }
.btn:disabled{ opacity:.45; cursor:not-allowed; transform:none !important; filter:grayscale(.5); }
.mod-status{ font-size:.86rem; font-weight:700; color:var(--ink-3); display:flex; align-items:center; gap:8px; }
.mod-status svg{ width:18px; height:18px; }

/* =========================================================================
   6. RETO FINAL
   ========================================================================= */
.quiz-wrap{ max-width:900px; margin:0 auto; }
.quiz-head{ display:flex; align-items:center; gap:16px; margin:22px 0 14px; }
.quiz-head .progress{ flex:1; height:10px; }
.quiz-count{ font-family:var(--font-title); font-weight:800; color:var(--ink); white-space:nowrap; }
.q-card{ background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:clamp(22px,3.4vw,40px); animation:viewIn .4s; }
.q-tags{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.q-tag{ padding:5px 12px; border-radius:99px; font-size:.72rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#fff; }
.q-text{ font-family:var(--font-title); font-size:clamp(1.15rem,2vw,1.45rem); font-weight:700; color:var(--ink); line-height:1.4; margin-bottom:8px; }
.q-scenario{ background:#f2f8ff; border-left:5px solid #22aaf0; border-radius:12px; padding:14px 18px; margin:12px 0 6px; font-size:1rem; }
.opts{ display:grid; gap:12px; margin-top:20px; }
.opt{
  display:flex; align-items:center; gap:14px; text-align:left; padding:16px 18px; border-radius:15px; background:#f8fafc; border:2px solid var(--line);
  font-size:1.02rem; font-weight:700; color:var(--ink-2); transition:all .2s;
}
.opt .l{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:#fff; border:2px solid var(--line); font-family:var(--font-title); font-weight:800; flex-shrink:0; }
.opt:hover:not(:disabled){ border-color:#22aaf0; background:#f2f9ff; transform:translateX(4px); }
.opt.correct{ border-color:var(--ok); background:var(--ok-bg); color:#0d5c30; }
.opt.correct .l{ background:var(--ok); border-color:var(--ok); color:#fff; }
.opt.wrong{ border-color:var(--bad); background:var(--bad-bg); color:#8a221d; animation:shake .4s; }
.opt.wrong .l{ background:var(--bad); border-color:var(--bad); color:#fff; }
.opt:disabled{ cursor:default; }
@keyframes shake{ 0%,100%{transform:none} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.order-pool,.order-picked{ display:grid; gap:10px; margin-top:14px; }
.order-picked{ min-height:60px; padding:12px; border:2px dashed var(--line); border-radius:15px; background:#fbfcfe; }
.order-picked:empty::before{ content:"Toca los elementos en el orden correcto…"; color:var(--ink-3); font-weight:700; font-size:.92rem; }
.order-item{ display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:13px; background:#f8fafc; border:2px solid var(--line); font-weight:700; text-align:left; transition:all .2s; }
.order-item:hover:not(:disabled){ border-color:#22aaf0; }
.order-item .n{ width:28px; height:28px; border-radius:8px; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:800; font-size:.8rem; flex-shrink:0; }
.order-item.correct{ border-color:var(--ok); background:var(--ok-bg); }
.order-item.wrong{ border-color:var(--bad); background:var(--bad-bg); }
.feedback{ margin-top:20px; border-radius:16px; padding:18px 20px; animation:viewIn .35s; }
.feedback.ok{ background:var(--ok-bg); border:1px solid #bfe9cf; }
.feedback.bad{ background:var(--bad-bg); border:1px solid #f5c6c3; }
.feedback h4{ display:flex; align-items:center; gap:8px; font-size:1.05rem; margin-bottom:6px; }
.feedback.ok h4{ color:var(--ok); } .feedback.bad h4{ color:var(--bad); }
.feedback h4 svg{ width:22px; height:22px; }
.feedback p{ font-size:.98rem; }
.feedback .src{ font-size:.8rem; font-weight:800; color:var(--ink-3); margin-top:8px; letter-spacing:.03em; }
.q-actions{ display:flex; justify-content:flex-end; margin-top:20px; gap:10px; }

.intro-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:22px 0; }
.field{ display:grid; gap:8px; margin:20px 0 6px; }
.field label{ font-weight:800; color:var(--ink); }
.field input{ font-family:inherit; font-size:1.05rem; padding:14px 16px; border-radius:13px; border:2px solid var(--line); background:#f8fafc; transition:border .2s; }
.field input:focus{ outline:none; border-color:#22aaf0; background:#fff; }

.result-hero{ text-align:center; padding:34px 20px 10px; }
.ring{ width:190px; height:190px; margin:0 auto 18px; position:relative; }
.ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring .val{ position:absolute; inset:0; display:grid; place-items:center; font-family:var(--font-title); font-weight:800; font-size:2.6rem; color:var(--ink); }
.ring .val small{ display:block; font-size:.8rem; color:var(--ink-3); font-weight:700; text-align:center; margin-top:-30px; }
.result-hero h2{ font-size:clamp(1.6rem,3vw,2.3rem); font-weight:800; }
.breakdown{ display:grid; gap:12px; margin:24px 0; }
.bd-row{ display:grid; grid-template-columns:200px 1fr 60px; gap:14px; align-items:center; font-weight:700; font-size:.92rem; }
.bd-bar{ height:12px; border-radius:99px; background:var(--bg-2); overflow:hidden; }
.bd-bar span{ display:block; height:100%; border-radius:99px; transition:width 1s cubic-bezier(.2,.8,.2,1); }
.review-item{ border-radius:14px; background:#f8fafc; border:1px solid var(--line); padding:14px 16px; margin-bottom:10px; }
.review-item b{ color:var(--ink); }
.review-item p{ font-size:.92rem; margin-top:4px; }
.cert{ display:none; }

/* =========================================================================
   7. MODAL, TOAST Y CONFETI
   ========================================================================= */
.modal-bg{ position:fixed; inset:0; z-index:100; background:rgba(20,30,45,.45); backdrop-filter:blur(5px); display:grid; place-items:center; padding:20px; animation:fadeIn .25s; }
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
.modal{ background:#fff; border-radius:26px; padding:38px 34px 30px; max-width:520px; width:100%; text-align:center; box-shadow:var(--shadow-lg); animation:pop .45s cubic-bezier(.2,1.4,.4,1); position:relative; overflow:hidden; }
@keyframes pop{ from{opacity:0; transform:scale(.85)} to{opacity:1; transform:none} }
.modal .check{ width:88px; height:88px; border-radius:50%; margin:0 auto 18px; display:grid; place-items:center; background:var(--g-green); color:#fff; box-shadow:0 12px 30px rgba(18,161,80,.35); }
.modal .check svg{ width:46px; height:46px; stroke-dasharray:40; stroke-dashoffset:40; animation:draw .6s .25s forwards; }
@keyframes draw{ to{stroke-dashoffset:0} }
.modal h2{ font-size:1.7rem; font-weight:800; margin-bottom:8px; }
.modal p{ font-size:1rem; margin-bottom:6px; }
.modal .actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:22px; }
.toast{ position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(30px); z-index:120; background:var(--ink); color:#fff; padding:14px 22px; border-radius:14px; font-weight:700; box-shadow:var(--shadow-lg); opacity:0; transition:all .35s; display:flex; align-items:center; gap:10px; max-width:90vw; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast svg{ width:20px; height:20px; flex-shrink:0; }
#confetti{ position:fixed; inset:0; pointer-events:none; z-index:130; }


/* =========================================================================
   4b. TABLERO REDISEÑADO: portada dividida + ruta de aprendizaje
   ========================================================================= */
.dash-hero{ display:grid; grid-template-columns:1.05fr 1fr; gap:28px; align-items:stretch; margin-bottom:40px; }
.dash-intro{ background:#fff; border-radius:28px; padding:clamp(24px,3.4vw,44px); box-shadow:var(--shadow); position:relative; overflow:hidden; isolation:isolate; display:flex; flex-direction:column; justify-content:center; }
.dash-intro::before{ content:""; position:absolute; width:260px; height:260px; border-radius:60px; transform:rotate(28deg); right:-120px; top:-110px; background:linear-gradient(135deg,rgba(26,213,196,.16),rgba(3,169,234,.12)); z-index:-1; }
.dash-intro::after{ content:""; position:absolute; width:150px; height:150px; border-radius:50%; left:-60px; bottom:-70px; background:rgba(153,95,206,.10); z-index:-1; }
.eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:.75rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#00a596; background:#e3f8f5; padding:6px 12px; border-radius:99px; width:fit-content; }
.eyebrow svg{ width:14px; height:14px; }
.dash-intro h1{ font-size:clamp(2.2rem,4.4vw,3.6rem); font-weight:800; margin:16px 0 10px; line-height:1.02; }
.dash-intro h1 span{ background:linear-gradient(90deg,#00a596,#0283c4 60%,#70409e); -webkit-background-clip:text; background-clip:text; color:transparent; }
.dash-intro > p{ font-size:clamp(1rem,1.4vw,1.15rem); max-width:520px; }
.dash-stats{ display:flex; align-items:center; gap:22px; margin-top:26px; flex-wrap:wrap; }
.mini-ring{ width:96px; height:96px; position:relative; flex-shrink:0; }
.mini-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.mini-ring b{ position:absolute; inset:0; display:grid; place-items:center; font-family:var(--font-title); font-size:1.4rem; color:var(--ink); }
.stat-list{ display:grid; gap:8px; }
.stat-list div{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:.95rem; }
.stat-list i{ width:10px; height:10px; border-radius:3px; display:inline-block; }

.next-card{ position:relative; overflow:hidden; border-radius:28px; padding:28px 30px; color:#fff; box-shadow:var(--shadow-lg); display:flex; flex-direction:column; isolation:isolate; min-height:340px; }
.next-card::before{ content:""; position:absolute; inset:auto -80px -120px auto; width:320px; height:320px; border-radius:50%; background:rgba(255,255,255,.12); z-index:-1; }
.next-card .lbl{ font-size:.75rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.9; display:flex; align-items:center; gap:8px; }
.next-card .lbl::before{ content:""; width:8px; height:8px; border-radius:50%; background:#fff; box-shadow:0 0 0 0 rgba(255,255,255,.7); animation:pulse 1.8s infinite; }
@keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)} 70%{box-shadow:0 0 0 12px rgba(255,255,255,0)} 100%{box-shadow:0 0 0 0 rgba(255,255,255,0)} }
.next-card .illu{ flex:1; display:grid; place-items:center; margin:8px 0 6px; }
.next-card .illu svg{ width:min(300px,80%); height:auto; filter:drop-shadow(0 14px 22px rgba(0,0,0,.18)); }
.next-card h2{ color:#fff; font-size:clamp(1.5rem,2.6vw,2rem); font-weight:800; }
.next-card p{ opacity:.92; margin:4px 0 16px; }
.btn-white{ background:#fff; color:var(--ink); box-shadow:0 8px 22px rgba(0,0,0,.15); align-self:flex-start; }
.btn-white:hover{ transform:translateY(-2px); }

.route-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin:8px 0 20px; flex-wrap:wrap; }
.route-head h2{ font-size:clamp(1.5rem,2.6vw,2.1rem); font-weight:800; }
.route-head p{ color:var(--ink-3); font-weight:600; }
.route{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; counter-reset:r; }
.rcard{ background:#fff; border-radius:24px; overflow:hidden; box-shadow:var(--shadow); text-align:left; display:flex; flex-direction:column; transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s; animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both; position:relative; }
.rcard:hover:not(.locked){ transform:translateY(-6px); box-shadow:var(--shadow-lg); }
.rcard:hover:not(.locked) .r-art svg{ transform:scale(1.06) rotate(-1.5deg); }
.r-art{ position:relative; height:170px; display:grid; place-items:center; overflow:hidden; isolation:isolate; }
.r-art::before{ content:""; position:absolute; width:200px; height:200px; border-radius:46px; transform:rotate(30deg); right:-70px; top:-90px; background:rgba(255,255,255,.14); z-index:-1; }
.r-art::after{ content:""; position:absolute; width:120px; height:120px; border-radius:50%; left:-40px; bottom:-60px; background:rgba(255,255,255,.12); z-index:-1; }
.r-art svg{ height:142px; width:auto; transition:transform .5s cubic-bezier(.2,.8,.2,1); filter:drop-shadow(0 10px 16px rgba(0,0,0,.16)); }
.r-num{ position:absolute; left:18px; top:144px; width:52px; height:52px; border-radius:16px; background:#fff; display:grid; place-items:center; font-family:var(--font-title); font-weight:800; font-size:1.25rem; box-shadow:var(--shadow); z-index:2; }
.r-status{ position:absolute; top:14px; right:14px; padding:5px 11px; border-radius:99px; font-size:.66rem; font-weight:800; letter-spacing:.1em; background:rgba(255,255,255,.9); display:inline-flex; align-items:center; gap:5px; color:var(--ink-2); z-index:2; }
.r-status svg{ width:12px; height:12px; }
.r-status.done{ background:var(--ok); color:#fff; }
.r-status.now{ background:#fff; color:var(--ink); }
.r-body{ padding:34px 22px 20px; display:flex; flex-direction:column; flex:1; }
.r-body h3{ font-size:1.25rem; font-weight:800; margin-bottom:6px; }
.r-body p{ font-size:.92rem; line-height:1.45; flex:1; }
.r-foot{ display:flex; align-items:center; gap:12px; margin-top:16px; }
.r-bar{ flex:1; height:8px; border-radius:99px; background:var(--bg-2); overflow:hidden; }
.r-bar span{ display:block; height:100%; border-radius:99px; }
.r-cta{ font-family:var(--font-title); font-weight:700; font-size:.8rem; letter-spacing:.04em; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.r-cta svg{ width:15px; height:15px; transition:transform .25s; }
.rcard:hover:not(.locked) .r-cta svg{ transform:translateX(4px); }
.rcard.locked{ cursor:not-allowed; }
.rcard.locked .r-art{ filter:grayscale(.35); opacity:.75; }
.rcard.locked .r-body{ opacity:.7; }
.rcard.current{ outline:3px solid var(--rc); outline-offset:4px; }

.final-wide{ margin-top:30px; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:26px; background:#fff; border-radius:26px; padding:20px 28px 20px 20px; box-shadow:var(--shadow); text-align:left; width:100%; transition:transform .3s, box-shadow .3s; }
.final-wide:hover:not(.locked){ transform:translateY(-4px); box-shadow:var(--shadow-lg); }
.final-wide .f-art{ width:170px; height:130px; border-radius:20px; background:var(--g-final); display:grid; place-items:center; position:relative; overflow:hidden; }
.final-wide .f-art svg{ height:112px; width:auto; filter:drop-shadow(0 8px 14px rgba(0,0,0,.18)); }
.final-wide.locked .f-art{ filter:grayscale(.6); opacity:.75; }
.final-wide h3{ font-size:1.45rem; font-weight:800; }
.final-wide p{ font-size:.95rem; }

/* Ilustración grande en el encabezado de cada módulo */
.mod-banner .row{ position:relative; }
.banner-art{ margin-left:auto; flex-shrink:0; }
.banner-art svg{ height:150px; width:auto; filter:drop-shadow(0 12px 18px rgba(0,0,0,.18)); animation:floaty 5s ease-in-out infinite; }
@keyframes floaty{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.next-card .illu svg{ animation:floaty 5s ease-in-out infinite; }

@media (max-width:1180px){ .route{ grid-template-columns:repeat(2,1fr); } .dash-hero{ grid-template-columns:1fr; } }
@media (max-width:680px){ .route{ grid-template-columns:1fr; } .final-wide{ grid-template-columns:1fr; } .final-wide .f-art{ width:100%; } .banner-art{ display:none; } }

/* =========================================================================
   4c. INFOGRAFÍAS DE CONTENIDO (un componente visual por sección)
   ========================================================================= */
.mark{ background:linear-gradient(transparent 55%, #ffe58a 55%); font-weight:800; }
.ig-k{ display:block; font-family:var(--font-title); font-weight:800; color:var(--ink); font-size:1.06rem; margin-bottom:5px; line-height:1.3; }
.ig p{ margin-bottom:0; }
.ig-ti{ width:48px; height:48px; border-radius:15px; display:grid; place-items:center; color:#fff; background:var(--mbg); flex-shrink:0;
  box-shadow:0 8px 18px color-mix(in srgb, var(--mc) 32%, transparent); }
.ig-ti svg{ width:24px; height:24px; }
.ig-lead{ font-size:1.08rem !important; padding:18px 22px; border-radius:18px; margin:4px 0 20px !important; font-weight:600; color:var(--ink);
  background:linear-gradient(120deg, color-mix(in srgb, var(--mc) 12%, #fff), #fff 70%); border-left:6px solid var(--mc); }
.ig-h3{ font-size:1.2rem; margin:24px 0 14px; }
.ig-caption{ font-size:.85rem !important; color:var(--ink-3); margin-top:12px !important; }

/* Línea de tiempo */
.ig-tl{ position:relative; display:grid; gap:14px; }
.ig-tl::before{ content:""; position:absolute; left:24px; top:16px; bottom:16px; width:4px; border-radius:4px;
  background:linear-gradient(var(--mc), color-mix(in srgb, var(--mc) 15%, transparent)); }
.ig-tl-item{ display:flex; gap:18px; align-items:flex-start; animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both; }
.ig-node{ width:52px; height:52px; border-radius:50%; display:grid; place-items:center; color:#fff; background:var(--mbg);
  border:4px solid #fff; box-shadow:0 6px 16px color-mix(in srgb, var(--mc) 35%, transparent); position:relative; z-index:1; flex-shrink:0; }
.ig-node svg{ width:22px; height:22px; }
.ig-tl-card{ flex:1; background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px 20px; box-shadow:var(--shadow-sm); transition:transform .25s, box-shadow .25s; }
.ig-tl-item:hover .ig-tl-card{ transform:translateX(4px); box-shadow:var(--shadow); }
.ig-tl-card p{ font-size:1.02rem; }

/* Mosaicos */
.ig-tiles{ display:grid; gap:16px; }
.ig-tiles.c2{ grid-template-columns:repeat(2,1fr); }
.ig-tiles.c3{ grid-template-columns:repeat(3,1fr); }
.ig-tile{ display:flex; flex-direction:column; gap:12px; background:#fff; border:1px solid var(--line); border-radius:20px; padding:22px;
  box-shadow:var(--shadow-sm); position:relative; overflow:hidden; animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both; transition:transform .25s, box-shadow .25s; }
.ig-tile:hover{ transform:translateY(-4px); box-shadow:var(--shadow); }
.ig-tile::after{ content:""; position:absolute; width:110px; height:110px; border-radius:50%; right:-40px; top:-40px; background:color-mix(in srgb, var(--mc) 10%, transparent); pointer-events:none; }
.ig-tiles.c1 .ig-tile{ flex-direction:row; align-items:flex-start; gap:18px; }
.ig-tile p{ font-size:1rem; }
.ig-tile ul{ list-style:none; display:grid; gap:7px; margin-top:4px; }
.ig-tile li{ position:relative; padding-left:20px; font-size:.95rem; line-height:1.4; }
.ig-tile li::before{ content:""; position:absolute; left:2px; top:.5em; width:9px; height:9px; border-radius:3px; transform:rotate(45deg); background:var(--mc); }

/* Flujo por pasos */
.ig-flow{ display:flex; align-items:stretch; gap:8px; }
.ig-fstep{ flex:1; background:#fff; border:1px solid var(--line); border-radius:20px; padding:22px; box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column; gap:12px; position:relative; overflow:hidden; animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both; }
.ig-fstep::before{ content:""; position:absolute; left:0; right:0; top:0; height:5px; background:var(--mbg); }
.ig-fn{ position:absolute; top:12px; right:16px; font-family:var(--font-title); font-weight:800; font-size:2.1rem; color:color-mix(in srgb, var(--mc) 22%, transparent); }
.ig-fstep p{ font-size:.98rem; }
.ig-arrow{ align-self:center; color:var(--mc); flex-shrink:0; }
.ig-arrow svg{ width:26px; height:26px; }

/* Cifras clave */
.ig-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-bottom:20px; }
.ig-stat{ border-radius:20px; padding:20px; color:#fff; background:var(--mbg); position:relative; overflow:hidden; box-shadow:var(--shadow); isolation:isolate; }
.ig-stat::after{ content:""; position:absolute; width:130px; height:130px; border-radius:50%; right:-45px; bottom:-55px; background:rgba(255,255,255,.14); z-index:-1; }
.ig-stat .ig-ti{ background:rgba(255,255,255,.22); box-shadow:none; margin-bottom:12px; width:42px; height:42px; }
.ig-stat strong{ display:block; font-family:var(--font-title); font-size:1.5rem; font-weight:800; line-height:1.15; }
.ig-stat small{ display:block; margin-top:4px; font-size:.86rem; opacity:.93; font-weight:700; }

.ig-roles{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.ig-roles span{ display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; font-weight:800; font-size:.83rem;
  background:color-mix(in srgb, var(--mc) 10%, #fff); color:var(--ink); border:1px solid color-mix(in srgb, var(--mc) 25%, #fff); }
.ig-roles svg{ width:14px; height:14px; color:var(--mc); }

.ig-remember{ display:flex; gap:14px; align-items:center; margin-top:18px; padding:16px 18px; border-radius:18px; background:color-mix(in srgb, var(--mc) 8%, #fff); border:1px solid color-mix(in srgb, var(--mc) 22%, #fff); }
.ig-remember p{ font-size:.98rem; }
.ig-remember.warn{ background:var(--warn-bg); border-color:#f6d68a; }
.ig-remember.warn .ig-ti{ background:linear-gradient(135deg,#ffb547,#e08a00); box-shadow:none; }

.ig-empty{ text-align:center; padding:40px 24px; border:2px dashed var(--line); border-radius:22px; color:var(--ink-3); background:#fbfcfe; }
.ig-empty svg{ width:52px; height:52px; color:var(--mc); margin-bottom:10px; }
.ig-empty b{ display:block; font-family:var(--font-title); font-size:1.2rem; color:var(--ink); margin-bottom:4px; }

/* Oficinas (módulo 4) */
.ig-offices{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.ig-office{ background:#fff; border:1px solid var(--line); border-radius:20px; padding:20px; box-shadow:var(--shadow-sm); }
.ig-office-top{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.ig-office-top h4{ font-size:1.15rem; }
.ig-big{ font-family:var(--font-title); font-size:1.8rem; font-weight:800; color:var(--ink); }
.ig-big small{ display:block; font-size:.72rem; color:var(--ink-3); letter-spacing:.08em; }
.ig-src{ margin-top:12px !important; font-size:.86rem !important; color:var(--ink-2); padding-top:10px; border-top:1px dashed var(--line); }

/* Seguridad (módulo 5): ilustración central rodeada de medidas */
.ig-orbit{ display:grid; grid-template-columns:1fr 250px 1fr; gap:20px; align-items:center; }
.ig-orbit .col{ display:grid; gap:16px; }
.ig-orbit .col .ig-tiles{ gap:16px; }
.ig-orbit .center{ display:grid; place-items:center; aspect-ratio:1; border-radius:50%; background:var(--mbg); box-shadow:var(--shadow-lg); position:relative; }
.ig-orbit .center::before{ content:""; position:absolute; inset:-12px; border-radius:50%; border:3px dashed color-mix(in srgb, var(--mc) 35%, transparent); animation:spin 30s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.ig-orbit .center svg{ width:76%; height:auto; filter:drop-shadow(0 10px 16px rgba(0,0,0,.18)); }

/* Documentación (módulo 6) */
.ig-split{ display:grid; grid-template-columns:1.2fr 1fr; gap:22px; align-items:start; }
.ig-stack{ background:color-mix(in srgb, var(--mc) 7%, #fff); border:2px dashed color-mix(in srgb, var(--mc) 45%, #fff); border-radius:22px; padding:18px; position:sticky; top:calc(var(--topbar-h) + 16px); }
.ig-stack-lbl{ display:flex; align-items:center; gap:8px; font-weight:800; color:var(--ink); font-size:.92rem; margin-bottom:12px; }
.ig-stack-lbl svg{ width:18px; height:18px; color:var(--mc); }
.ig-stack-items{ display:flex; flex-direction:column-reverse; gap:8px; }
.ig-stack-items div{ padding:11px 14px; border-radius:12px; font-weight:800; font-size:.86rem; }
.s-doc{ background:#fff; border:1px solid var(--line); color:var(--ink); box-shadow:var(--shadow-sm); }
.s-bag{ background:var(--mbg); color:#fff; margin-left:18px; }
.s-more{ color:var(--ink-3); text-align:center; font-style:italic; }
.ig-stack-axis{ display:block; margin-top:12px; font-size:.78rem; font-weight:800; color:var(--ink-3); text-align:center; letter-spacing:.03em; }
.ig-ticket{ background:#fff; border-radius:20px; box-shadow:var(--shadow); overflow:hidden; border:1px solid var(--line); }
.ig-ticket-head{ background:var(--mbg); color:#fff; padding:14px 20px; font-family:var(--font-title); font-weight:800; display:flex; align-items:center; gap:10px; letter-spacing:.04em; }
.ig-ticket-head svg{ width:20px; height:20px; }
.ig-ticket dl{ display:grid; grid-template-columns:auto 1fr; gap:12px 16px; padding:20px; }
.ig-ticket dt{ font-weight:800; color:var(--ink); }
.ig-pdf{ list-style:none; counter-reset:p; display:grid; gap:8px; }
.ig-pdf li{ counter-increment:p; display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:11px 14px; font-weight:700; font-size:.95rem; box-shadow:var(--shadow-sm); }
.ig-pdf li:nth-child(2){ margin-left:8px; } .ig-pdf li:nth-child(3){ margin-left:16px; } .ig-pdf li:nth-child(4){ margin-left:24px; } .ig-pdf li:nth-child(5){ margin-left:32px; }
.ig-pdf li::before{ content:counter(p); width:32px; height:32px; border-radius:10px; display:grid; place-items:center; color:#fff; background:var(--mbg); font-family:var(--font-title); font-weight:800; flex-shrink:0; }

.big-msg{ display:flex; align-items:center; justify-content:center; gap:14px; }
.big-msg svg{ width:34px; height:34px; flex-shrink:0; }

/* Registro, créditos y estado de envío */
.reg-wrap{ max-width:1060px; }
.reg-card{ display:grid; grid-template-columns:.9fr 1.1fr; background:#fff; border-radius:28px; overflow:hidden; box-shadow:var(--shadow-lg); }
.reg-art{ display:grid; place-items:center; padding:30px; position:relative; overflow:hidden; isolation:isolate; }
.reg-art::before{ content:""; position:absolute; width:300px; height:300px; border-radius:70px; transform:rotate(30deg); background:rgba(255,255,255,.12); right:-120px; top:-120px; z-index:-1; }
.reg-art svg{ width:90%; height:auto; filter:drop-shadow(0 14px 22px rgba(0,0,0,.2)); animation:floaty 5s ease-in-out infinite; }
.reg-body{ padding:clamp(24px,4vw,46px); }
.reg-body h1{ font-size:clamp(1.8rem,3.2vw,2.5rem); font-weight:800; margin:14px 0 8px; }
.reg-body h1 span{ background:linear-gradient(90deg,#00a596,#0283c4); -webkit-background-clip:text; background-clip:text; color:transparent; }
.err{ color:var(--bad); font-weight:700; font-size:.82rem; min-height:1em; }
.reg-check{ display:flex; gap:10px; align-items:flex-start; margin-top:14px; font-size:.92rem; font-weight:600; cursor:pointer; }
.reg-check input{ width:20px; height:20px; margin-top:2px; accent-color:#00a596; flex-shrink:0; }
.reg-credit{ margin-top:22px; font-size:.82rem; color:var(--ink-3); text-align:center; }
.user-chip{ cursor:default; }
.user-chip:hover{ background:var(--bg-2); color:var(--ink-2); }
.side-credit{ display:flex; gap:10px; align-items:center; margin:14px 8px 0; padding:12px 14px; border-radius:14px; background:linear-gradient(120deg,#e3f8f5,#e3f3fc); font-size:.8rem; color:var(--ink-2); line-height:1.35; }
.side-credit svg{ width:18px; height:18px; color:#00a596; flex-shrink:0; }
.dash-credit{ margin-top:22px !important; font-size:.85rem !important; color:var(--ink-3); display:flex; align-items:center; gap:8px; }
.dash-credit svg,.page-credit svg{ width:16px; height:16px; color:#00a596; }
.page-credit{ text-align:center; margin-top:36px; font-size:.85rem; color:var(--ink-3); display:flex; align-items:center; justify-content:center; gap:8px; }
.send-status{ margin-top:16px; display:flex; flex-direction:column; align-items:center; gap:10px; }
.ss{ display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:99px; font-weight:800; font-size:.88rem; background:var(--bg-2); color:var(--ink-2); }
.ss svg{ width:18px; height:18px; }
.ss.ok{ background:var(--ok-bg); color:var(--ok); }
.ss.bad{ background:var(--bad-bg); color:var(--bad); max-width:620px; border-radius:16px; text-align:left; }
.rcard.closed-done .r-art{ filter:none; opacity:1; }
.rcard.closed-done .r-body{ opacity:1; }

@media (max-width:1180px){ .ig-tiles.c3,.ig-offices{ grid-template-columns:repeat(2,1fr); } .ig-orbit{ grid-template-columns:1fr; } .ig-orbit .center{ width:240px; margin:0 auto; order:-1; } }
@media (max-width:900px){
  .ig-flow{ flex-direction:column; } .ig-arrow{ transform:rotate(90deg); }
  .ig-split,.reg-card{ grid-template-columns:1fr; } .ig-stack{ position:static; } .reg-art{ max-height:260px; } .reg-art svg{ width:55%; }
}
@media (max-width:680px){ .ig-tiles.c2,.ig-tiles.c3,.ig-offices{ grid-template-columns:1fr; } .ig-tiles.c1 .ig-tile{ flex-direction:column; } }

/* =========================================================================
   8. ADAPTABILIDAD (portátiles, tabletas, celulares y proyección)
   ========================================================================= */
@media (min-width:1700px){ html{ font-size:110%; } html.proyeccion{ font-size:128%; } }
@media (max-width:1180px){
  .cards{ grid-template-columns:repeat(2,1fr); }
  .offices,.grid3,.intro-grid{ grid-template-columns:repeat(2,1fr); }
}
@media (max-width:960px){
  .layout{ grid-template-columns:1fr; }
  .sidebar{ position:fixed; left:0; top:var(--topbar-h); z-index:60; width:300px; background:#fff; transform:translateX(-105%); transition:transform .3s; box-shadow:var(--shadow-lg); }
  .sidebar.open{ transform:none; }
  .menu-toggle{ display:inline-flex; }
  .brand-sep,.brand-name{ display:none; }
  .how{ grid-template-columns:1fr; }
}
@media (max-width:680px){
  :root{ --topbar-h:auto; }
  .topbar{ flex-wrap:wrap; padding:10px 14px; gap:10px; height:auto; }
  .progress-wrap{ order:3; flex-basis:100%; max-width:none; }
  .top-actions .lbl{ display:none; }
  .cards,.offices,.grid3,.grid2,.intro-grid{ grid-template-columns:1fr; }
  .final-card{ flex-direction:column; align-items:flex-start; }
  .bd-row{ grid-template-columns:1fr 60px; } .bd-row .bd-bar{ grid-column:1/-1; grid-row:2; }
  .mod-banner{ padding:22px; }
  .sidebar{ top:0; height:100vh; }
}
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }

/* Impresión de la constancia de resultado */
@media print{ .send-status,.page-credit svg{ display:none !important; } }
@media print{
  .topbar,.sidebar,.no-print,#confetti{ display:none !important; }
  .layout{ display:block; } main{ padding:0; }
  body{ background:#fff; }
  .cert{ display:block; text-align:center; margin-bottom:20px; }
  .cert img{ height:70px; }
  .q-card,.content-card{ box-shadow:none; border:1px solid #ddd; }
}
</style>
</head>

/* ------------------------- E. ESTADO -------------------------
   Se guarda en el navegador de cada funcionario (try/catch en cada acceso).
   user      → nombre completo, correo y fecha de registro
   visited   → secciones consultadas por módulo
   done/doneAt → módulos revisados y fecha
   quiz      → reto en curso (preguntas y respuestas, persiste si recarga)
   finished  → resultado final y estado del envío por correo
   -------------------------------------------------------------- */
const defaultState = () => ({ user:null, visited:{}, done:[], doneAt:{}, quiz:null, finished:null, projection:false });
let STATE = loadState();
function loadState(){
  try{ const raw = localStorage.getItem(CONFIG.storageKey); if (raw) return Object.assign(defaultState(), JSON.parse(raw)); }catch(e){}
  return defaultState();
}
function saveState(){ try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(STATE)); }catch(e){} }

const modIndex   = (id) => MODULES.findIndex(m => m.id === id);
const isDone     = (i) => STATE.done.includes(MODULES[i].id);
const isUnlocked = (i) => MODULES.slice(0, i).every(m => STATE.done.includes(m.id));
const allDone    = () => MODULES.every(m => STATE.done.includes(m.id));
const visitedOf  = (id) => STATE.visited[id] || [];
const currentModuleIdx = () => MODULES.findIndex((m, k) => !isDone(k));
const quizStarted = () => !!(STATE.quiz || STATE.finished);   // al iniciar el reto, los módulos se cierran
const canOpenModule = (i) => isUnlocked(i) && !quizStarted();
const fmtDate = (iso) => iso ? new Date(iso).toLocaleString('es-CO', { dateStyle:'medium', timeStyle:'short' }) : '—';

/* ------------------------- F. VISTAS ------------------------- */
const app = document.getElementById('app');
const CREDIT = `Elaborado por <b>${CONFIG.autora}</b> · ${CONFIG.cargoAutora}`;

/* ---- Barra superior + navegación lateral ---- */
function renderChrome(active){
  const n = STATE.done.length, pct = Math.round(n / MODULES.length * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressBar').setAttribute('aria-valuenow', pct);
  document.getElementById('progressText').innerHTML = STATE.finished ? '<b>Reto completado</b>' : allDone() ? '<b>¡6 de 6!</b> Reto final habilitado' : `<b>${n}</b> de ${MODULES.length} módulos · ${pct}%`;
  const cur = currentModuleIdx();
  document.getElementById('progressDots').innerHTML = MODULES.map((m, i) => `<span class="${isDone(i) ? 'done' : (i === cur ? 'current' : '')}"></span>`).join('');
  document.getElementById('userChip').innerHTML = STATE.user ? `${ICON.user}<span class="lbl">${escapeHTML(STATE.user.nombre.split(' ')[0])}</span>` : '';
  document.getElementById('userChip').style.display = STATE.user ? '' : 'none';

  const closed = quizStarted();
  const link = (key, label, sub, ico, grad, locked, state, href) => `
    <button class="side-link ${active === key ? 'active' : ''} ${locked ? 'locked' : ''}" data-href="${href}" ${locked ? 'aria-disabled="true"' : ''}>
      <span class="side-ico" style="background:${grad}">${ico}</span>
      <span class="side-txt">${label}<small>${sub}</small></span>
      <span class="side-state ${state}">${state === 'ok' ? ICON.checkC : state === 'lock' ? ICON.lock : ''}</span>
    </button>`;
  let html = `<div class="side-title">Inicio</div>` +
    link('home', 'Tablero principal', 'Vista general', ICON.home, 'linear-gradient(135deg,#5b6b7c,#2f3b48)', !STATE.user, '', '#/') +
    `<div class="side-title" style="margin-top:18px">Módulos</div>`;
  MODULES.forEach((m, i) => {
    const locked = !STATE.user || !canOpenModule(i);
    const sub = closed ? (isDone(i) ? 'Revisado · cerrado' : 'Cerrado') : isDone(i) ? 'Revisado' : !isUnlocked(i) ? 'Bloqueado' : `${visitedOf(m.id).length}/${m.sections.length} secciones`;
    html += link(m.id, `${i + 1}. ${m.title}`, sub, ICON[m.icon], m.grad, locked, isDone(i) ? 'ok' : locked ? 'lock' : '', `#/modulo/${i + 1}`);
  });
  const retoSub = STATE.finished ? `Completado · ${STATE.finished.pct}%` : STATE.quiz ? 'En curso' : allDone() ? 'Habilitado' : 'Completa los 6 módulos';
  html += `<div class="side-divider"></div>` + link('reto', 'Reto final', retoSub, ICON.trophy, 'var(--g-final)', !allDone(), STATE.finished ? 'ok' : allDone() ? '' : 'lock', '#/reto');
  html += `<div class="side-legend">
      <p><span class="dot" style="background:#9b6ad8"></span><span><b>Complementaria</b>: sugerencia de buena práctica, no es lineamiento institucional.</span></p>
      <p><span class="dot" style="background:#f0a500"></span><span><b>Nota</b>: aclaración sobre el documento fuente.</span></p>
    </div>
    <div class="side-credit">${ICON.pen}<span>${CREDIT}</span></div>`;
  const sb = document.getElementById('sidebar');
  sb.innerHTML = html;
  sb.querySelectorAll('.side-link').forEach(b => b.addEventListener('click', () => {
    if (b.classList.contains('locked')) {
      toast(ICON.lock + (!STATE.user ? ' Primero registra tus datos.' : closed ? ' Los módulos se cerraron al iniciar el reto final.' : ' Completa los módulos anteriores para habilitar esta opción.'));
      return;
    }
    closeSidebar(); go(b.dataset.href);
  }));
}

        <div id="regForm">

  const doRegister = () => {
    const nombre = document.getElementById('rName').value.trim().replace(/\s+/g, ' ');

    let valid = true;
    const setErr = (id, msg) => { document.getElementById(id).textContent = msg; if (msg) valid = false; };
    setErr('eName', nombre.split(' ').length >= 2 && nombre.length >= 5 ? '' : 'Escribe tu nombre completo (nombres y apellidos).');
    setErr('eMail', /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo) ? '' : 'Escribe un correo válido.');
    setErr('eOk', ok ? '' : 'Debes confirmar tus datos para continuar.');
    if (!valid) return;
    STATE.user = { nombre, correo, registeredAt: new Date().toISOString() };

}

/* ---- Vista de un módulo ---- */
function renderModule(i, s){
  const m = MODULES[i];
  s = Math.max(0, Math.min(s, m.sections.length - 1));
  const v = new Set(visitedOf(m.id)); v.add(s); STATE.visited[m.id] = [...v]; saveState();
  renderChrome(m.id);

  const allSeen = m.sections.every((_, k) => v.has(k));
  const done = isDone(i), last = s === m.sections.length - 1;
  const chips = m.sections.map((sec, k) => `
    <button class="step-chip ${v.has(k) ? 'visited' : ''} ${k === s ? 'current' : ''}" data-s="${k}">
      <span class="n">${v.has(k) && k !== s ? '✓' : k + 1}</span>${sec.title}</button>`).join('');
  const pending = m.sections.length - v.size;
  const status = done ? `<span class="mod-status" style="color:var(--ok)">${ICON.checkC} Módulo revisado</span>`
    : allSeen ? `<span class="mod-status" style="color:var(--ok)">${ICON.checkC} Consultaste todo el contenido</span>`
    : `<span class="mod-status">${ICON.info} Te ${pending === 1 ? 'falta' : 'faltan'} ${pending} ${pending === 1 ? 'sección' : 'secciones'} por consultar</span>`;
  let nextBtn;
  if (!last) nextBtn = `<button class="btn btn-primary" id="btnNext">Siguiente sección ${ICON.arrowR}</button>`;
  else if (done) nextBtn = i < MODULES.length - 1 ? `<button class="btn btn-primary" id="btnGoNext">Ir al módulo ${i + 2} ${ICON.arrowR}</button>` : `<button class="btn btn-primary" id="btnGoReto">Ir al reto final ${ICON.trophy}</button>`;
  else nextBtn = `<button class="btn btn-ok" id="btnMark" ${allSeen ? '' : 'disabled'}>${ICON.check} Marcar módulo como revisado</button>`;
  const sec = m.sections[s];
  const body = typeof sec.html === 'function' ? sec.html() : sec.html;

  app.innerHTML = `<div class="view" style="--mc:${m.color}; --mbg:${m.grad}">
    <section class="mod-banner" style="background:${m.grad}">
      <button class="back-link" id="btnBack">${ICON.arrowL} TABLERO</button>
      <div class="row"><span class="mcard-ico">${ICON[m.icon]}</span>
        <div><p class="mcard-num" style="opacity:.85">MÓDULO ${i + 1} DE ${MODULES.length}</p><h1>${m.title}</h1><p>${m.desc}</p></div>
        <span class="banner-art">${ILLU[m.id]}</span></div>
    </section>
    <nav class="stepper" aria-label="Secciones del módulo">${chips}</nav>
    <article class="content-card ig">
      <h2>${sec.title}</h2><p class="kicker">Sección ${s + 1} de ${m.sections.length}</p>
      ${body}
    </article>
    <div class="mod-nav">
      <button class="btn btn-ghost" id="btnPrev" ${s === 0 ? 'disabled' : ''}>${ICON.arrowL} Anterior</button>
      ${status}${nextBtn}
    </div>
  </div>`;

  const goSec = (k) => { go(`#/modulo/${i + 1}/${k + 1}`); };
  app.querySelectorAll('.step-chip').forEach(c => c.addEventListener('click', () => goSec(+c.dataset.s)));
  document.getElementById('btnBack').onclick = () => go('#/');
  document.getElementById('btnPrev').onclick = () => goSec(s - 1);
  const bn = document.getElementById('btnNext'); if (bn) bn.onclick = () => goSec(s + 1);
  const bg = document.getElementById('btnGoNext'); if (bg) bg.onclick = () => go(`#/modulo/${i + 2}`);
  const br = document.getElementById('btnGoReto'); if (br) br.onclick = () => go('#/reto');
  const bm = document.getElementById('btnMark'); if (bm) bm.onclick = () => completeModule(i);
}

function completeModule(i){
  const m = MODULES[i];
  if (!m.sections.every((_, k) => visitedOf(m.id).includes(k))) return;
  if (!STATE.done.includes(m.id)) { STATE.done.push(m.id); STATE.doneAt[m.id] = new Date().toISOString(); }
  saveState(); renderChrome(m.id); confetti(i === MODULES.length - 1 ? 220 : 110);
  const isLast = i === MODULES.length - 1;
  modal(`
    <div class="check">${svg('<path d="M20 6 9 17l-5-5"/>', 3)}</div>
    <h2>${isLast ? '¡Completaste los 6 módulos!' : '¡Módulo completado!'}</h2>
    <p>Revisaste <b>${m.title}</b>.</p>
    <p>${isLast ? 'El <b>reto final</b> ya está habilitado. Recuerda: al iniciarlo, los módulos se cierran y tienes un solo intento.' : `Se habilitó el módulo ${i + 2}: <b>${MODULES[i + 1].title}</b>.`}</p>
    <div class="actions">
      <button class="btn btn-ghost" data-act="home">${ICON.home} Tablero</button>
      ${isLast ? `<button class="btn btn-primary" data-act="reto" style="background:var(--g-final)">Ir al reto ${ICON.trophy}</button>`
               : `<button class="btn btn-primary" data-act="next" style="background:${MODULES[i + 1].grad}">Continuar ${ICON.arrowR}</button>`}

      go(act === 'reto' ? '#/reto' : act === 'next' ? `#/modulo/${i + 2}` : '#/');

}

/* Arma el intento: N preguntas al azar por módulo, barajadas (se guarda en STATE.quiz) */
function buildQuiz(){
  let qs = [];
  MODULES.forEach(m => { qs = qs.concat(shuffle(BANK.filter(q => q.m === m.id)).slice(0, CONFIG.questionsPerModule)); });
  qs = shuffle(qs).map(q => {
    const c = { ...q };
    if (q.type === 'mc') { const idx = shuffle(q.opts.map((_, k) => k)); c.view = idx.map(k => q.opts[k]); c.correct = idx.indexOf(0); }
    if (q.type === 'tf') { c.view = ['Verdadero', 'Falso']; c.correct = q.ans ? 0 : 1; }
    if (q.type === 'order') { c.pool = shuffle(q.items.map((_, k) => k)); c.picked = []; }
    return c;
  });
  return { id: 'R-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase(), qs, i:0, results:[], startedAt:new Date().toISOString() };
}

/* ---- Reto final: pregunta actual (sin opción de salir; respuesta queda registrada) ---- */
function renderQuestion(){
  const Q = STATE.quiz; renderChrome('reto');
  const q = Q.qs[Q.i], m = MODULES[modIndex(q.m)], prev = Q.results[Q.i];
  const kindColor = { 'Pregunta':'var(--g-blue)', 'Simulación':'var(--g-orng)', 'Caso práctico':'var(--g-purp)' }[q.kind];
  const pct = Math.round(Q.i / Q.qs.length * 100);
  const body = q.type === 'order'
    ? `<p style="font-weight:700;margin-top:10px">Tu orden:</p><div class="order-picked" id="picked"></div>
       <p style="font-weight:700;margin-top:16px" id="poolLbl">Elementos disponibles:</p><div class="order-pool" id="pool"></div>`
    : `<div class="opts">${q.view.map((o, k) => `<button class="opt" data-k="${k}"><span class="l">${q.type === 'tf' ? (k ? 'F' : 'V') : 'ABCD'[k]}</span><span>${o}</span></button>`).join('')}</div>`;
  app.innerHTML = `<div class="view quiz-wrap">
    <div class="quiz-head">
      <span class="chip">${ICON.lock} Módulos cerrados</span>
      <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span class="quiz-count">${Q.i + 1} / ${Q.qs.length}</span>
    </div>
    <div class="q-card">
      <div class="q-tags"><span class="q-tag" style="background:${kindColor}">${q.kind}</span><span class="q-tag" style="background:${m.grad}">${m.title}</span></div>
      <p class="q-text">${q.q}</p>${body}<div id="fb"></div>
      <div class="q-actions" id="qActions">${q.type === 'order' && !prev ? `<button class="btn btn-ghost" id="btnClear">Reiniciar orden</button><button class="btn btn-primary" id="btnCheck" disabled style="background:var(--g-final)">Comprobar</button>` : ''}</div>
    </div>
  </div>`;

  if (q.type === 'order') {
    if (prev) q.picked = prev.picked;
    const drawOrder = () => {
      document.getElementById('picked').innerHTML = q.picked.map((k, n) => `<button class="order-item ${prev ? (k === n ? 'correct' : 'wrong') : ''}" data-k="${k}" data-from="picked" ${prev ? 'disabled' : ''}><span class="n">${n + 1}</span>${q.items[k]}</button>`).join('');
      document.getElementById('pool').innerHTML = q.pool.filter(k => !q.picked.includes(k)).map(k => `<button class="order-item" data-k="${k}" data-from="pool"><span class="n" style="background:var(--ink-3)">+</span>${q.items[k]}</button>`).join('');
      if (prev) { document.getElementById('poolLbl').remove(); return; }
      document.getElementById('btnCheck').disabled = q.picked.length !== q.items.length;
      app.querySelectorAll('.order-item').forEach(b => b.onclick = () => {
        const k = +b.dataset.k;
        if (b.dataset.from === 'pool') q.picked.push(k); else q.picked = q.picked.filter(x => x !== k);
        drawOrder();
      });
    };
    drawOrder();
    if (!prev) {
      document.getElementById('btnClear').onclick = () => { q.picked = []; drawOrder(); };
      document.getElementById('btnCheck').onclick = () => {
        const ok = q.picked.every((k, n) => k === n);
        answer(ok, { picked:[...q.picked], resp:q.picked.map(k => q.items[k]).join(' → '), corr:q.items.join(' → ') });
      };
    }
  } else {
    const lockOpts = (k) => app.querySelectorAll('.opt').forEach((o, n) => { o.disabled = true; if (n === q.correct) o.classList.add('correct'); if (n === k && k !== q.correct) o.classList.add('wrong'); });
    if (prev) lockOpts(prev.k);
    else app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const k = +b.dataset.k; lockOpts(k);
      answer(k === q.correct, { k, resp:q.view[k], corr:q.view[q.correct] });
    });
  }
  if (prev) showFeedback();
}

/* Registra la respuesta (no se puede cambiar) */
function answer(ok, extra){
  const Q = STATE.quiz, q = Q.qs[Q.i];
  if (Q.results[Q.i]) return;
  Q.results[Q.i] = { ok, m:q.m, kind:q.kind, q:q.q, exp:q.exp, src:q.src, at:new Date().toISOString(), ...extra };
  saveState();
  if (q.type === 'order') { const c = document.getElementById('btnClear'); if (c) c.remove(); const k = document.getElementById('btnCheck'); if (k) k.remove(); renderQuestion(); return; }
  showFeedback();
}
function showFeedback(){
  const Q = STATE.quiz, r = Q.results[Q.i], last = Q.i === Q.qs.length - 1;
  document.getElementById('fb').innerHTML = `<div class="feedback ${r.ok ? 'ok' : 'bad'}">
      <h4>${r.ok ? ICON.checkC + ' ¡Correcto!' : ICON.x + ' Respuesta incorrecta'}</h4>
      <p>${r.exp}</p><p class="src">FUENTE: ${r.src}</p></div>`;
  const actions = document.getElementById('qActions');
  actions.innerHTML = `<button class="btn btn-primary" id="btnNextQ" style="background:var(--g-final)">${last ? 'Finalizar y enviar ' + ICON.send : 'Siguiente ' + ICON.arrowR}</button>`;
  const nb = document.getElementById('btnNextQ'); nb.focus({ preventScroll:true });
  nb.onclick = () => {
    if (last) { finishQuiz(); return; }
    Q.i++; saveState(); renderQuestion(); window.scrollTo({ top:0, behavior:'smooth' });
  };
}

function finishQuiz(){
  const Q = STATE.quiz;
  const okN = Q.results.filter(r => r.ok).length, total = Q.results.length, pct = Math.round(okN / total * 100);
  const perModule = MODULES.map(m => { const rs = Q.results.filter(r => r.m === m.id); return { id:m.id, title:m.title, ok:rs.filter(r => r.ok).length, total:rs.length }; });
  STATE.finished = { id:Q.id, okN, total, pct, perModule, results:Q.results, startedAt:Q.startedAt, finishedAt:new Date().toISOString(), sent:'pending' };
  STATE.quiz = null; saveState();
  go('#/reto');
  sendResults();
}

        <button class="btn btn-ghost" id="btnPrint">${ICON.printer} Imprimir</button>
        <button class="btn btn-primary" id="btnCert" style="background:var(--g-final)">${ICON.doc} Descargar constancia</button>
      </div>
      <p class="page-credit" style="margin-top:22px">${ICON.pen} ${CREDIT}</p>
    </div>
  </div>`;
  requestAnimationFrame(() => setTimeout(() => {
    document.getElementById('ringArc').style.strokeDashoffset = C * (1 - F.pct / 100);
    app.querySelectorAll('.bd-bar span').forEach(s => s.style.width = s.dataset.w);
  }, 80));
  if (pass && !F.celebrated) { F.celebrated = true; saveState(); setTimeout(() => confetti(260), 500); }
  document.getElementById('btnHome').onclick = () => go('#/');
  document.getElementById('btnPrint').onclick = () => {
    try { window.print(); } catch (e) {}
    toast(ICON.info + ' Si no se abre la ventana de impresión, usa “Descargar constancia”.');
  };
  document.getElementById('btnCert').onclick = downloadCertificate;
  updateSendStatus();
  if (F.sent === 'pending' || F.sent === 'error' || F.sent === 'sending') sendResults();
}

/* ------------------------- G. ENVÍO DE RESULTADOS -------------------------
   Envía nombre, correo, puntaje, fechas y el detalle de cada respuesta.
   Si falla (sin internet), queda pendiente y se reintenta al volver a abrir
   la plataforma o con el botón "Reintentar envío" (NO repite el reto).
   -------------------------------------------------------------------------- */
let sending = false;
function buildPayload(){
  const F = STATE.finished, U = STATE.user;
  const durMin = Math.max(1, Math.round((new Date(F.finishedAt) - new Date(F.startedAt)) / 60000));
  return {
    id: F.id, nombre: U.nombre, correo: U.correo,
    puntaje: F.pct + '%', correctas: `${F.okN} de ${F.total}`,
    meta: CONFIG.passPercent + '%', alcanzaMeta: F.pct >= CONFIG.passPercent ? 'Sí' : 'No',
    registro: fmtDate(U.registeredAt),
    modulos: MODULES.map((m, i) => `${i + 1}. ${m.title}: revisado ${fmtDate(STATE.doneAt[m.id])}`).join('\n'),
    inicioReto: fmtDate(F.startedAt), finReto: fmtDate(F.finishedAt), duracion: durMin + ' min',
    porModulo: F.perModule.map(p => `${p.title}: ${p.ok}/${p.total}`).join('\n'),
    respuestas: F.results.map((r, n) => `${n + 1}. [${MODULES[modIndex(r.m)].title} · ${r.kind}] ${r.ok ? '✔ CORRECTA' : '✘ INCORRECTA'}\n   Pregunta: ${r.q}\n   Respondió: ${r.resp}${r.ok ? '' : `\n   Correcta: ${r.corr}`}`).join('\n\n'),
    navegador: navigator.userAgent,
  };
}
async function sendResults(){
  const F = STATE.finished, cfg = CONFIG.envio;
  if (!F || F.sent === 'ok' || sending) return;
  if ((cfg.metodo === 'formsubmit' && !cfg.destino) || (cfg.metodo === 'appsscript' && !cfg.url)) { F.sent = 'noconfig'; saveState(); updateSendStatus(); return; }
  sending = true; F.sent = 'sending'; updateSendStatus();
  const d = buildPayload();
  try {
    if (cfg.metodo === 'appsscript') {
      const opts = { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(d) };
      try { const r = await fetch(cfg.url, opts); if (!r.ok) throw new Error('http'); }
      catch (e) { await fetch(cfg.url, { ...opts, mode:'no-cors' }); }   // respaldo: envío sin lectura de respuesta
    } else {
      const fields = {
        _subject: `Caja bajo Control · ${d.nombre} · ${d.puntaje}`, _template: 'table', _captcha: 'false',
        name: d.nombre, email: d.correo,
        'Nombre completo': d.nombre, 'Correo del funcionario': d.correo, 'Puntaje': d.puntaje, 'Respuestas correctas': d.correctas,
        'Meta de la plataforma': d.meta, 'Alcanza la meta': d.alcanzaMeta, 'Registro en la plataforma': d.registro,
        'Módulos revisados': d.modulos, 'Inicio del reto': d.inicioReto, 'Fin del reto': d.finReto, 'Duración del reto': d.duracion,
        'Resultado por módulo': d.porModulo, 'Detalle de respuestas': d.respuestas, 'ID del intento': d.id, 'Navegador': d.navegador,
      };
      const r = await fetch('https://formsubmit.co/ajax/' + cfg.destino, { method:'POST', headers:{ 'Content-Type':'application/json', 'Accept':'application/json' }, body:JSON.stringify(fields) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.success === false || j.success === 'false') throw new Error(j.message || 'error');
    }
    F.sent = 'ok'; F.sentAt = new Date().toISOString();
  } catch (e) { F.sent = 'error'; }
  sending = false; saveState(); updateSendStatus();
}
function updateSendStatus(){
  const el = document.getElementById('sendStatus'); if (!el || !STATE.finished) return;
  const F = STATE.finished;
  const map = {
    ok:       `<span class="ss ok">${ICON.checkC} Resultado enviado a Tesorería · ${fmtDate(F.sentAt)}</span>`,
    sending:  `<span class="ss">${ICON.send} Enviando resultado a Tesorería…</span>`,
    pending:  `<span class="ss">${ICON.send} Enviando resultado a Tesorería…</span>`,
    error:    `<span class="ss bad">${ICON.x} No se pudo enviar el resultado (revisa tu conexión).</span><button class="btn btn-ghost" id="btnResend">${ICON.send} Reintentar envío</button>`,
    noconfig: `<span class="ss bad">${ICON.info} El envío por correo aún no está configurado. Tu resultado quedó guardado en este equipo; informa a Tesorería.</span>`,
  };
  el.innerHTML = map[F.sent] || '';
  const b = document.getElementById('btnResend'); if (b) b.onclick = () => sendResults();
}

/* ------------------------- G. UTILIDADES ------------------------- */
function shuffle(a){ a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function escapeHTML(s){ return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

let toastTimer;
function toast(html){
  const t = document.getElementById('toast'); t.innerHTML = html; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}
function modal(html, onAction){
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);
  const close = (act) => { bg.remove(); document.removeEventListener('keydown', esc); if (onAction) onAction(act); };
  const esc = (e) => { if (e.key === 'Escape') close('esc'); };
  document.addEventListener('keydown', esc);
  bg.addEventListener('click', e => { if (e.target === bg) close('bg'); });
  bg.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => close(b.dataset.act)));
  const first = bg.querySelector('[data-act]:last-child'); if (first) first.focus();
}

/* Confeti ligero en canvas (sin librerías) */
function confetti(n = 150){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#1ad5c4', '#03a9ea', '#995fce', '#00cf6a', '#faa662', '#009bd0'];
  const ps = Array.from({ length:n }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .35, r: 4 + Math.random() * 6,
    vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4, c: colors[Math.floor(Math.random() * colors.length)],
    a: Math.random() * Math.PI, va: (Math.random() - .5) * .3, sq: Math.random() > .5
  }));
  let frame = 0;
  (function tick(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      if (p.sq) ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6); else { ctx.beginPath(); ctx.arc(0, 0, p.r / 2, 0, 7); ctx.fill(); }
      ctx.restore(); });
    if (++frame < 170) requestAnimationFrame(tick); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

(function adminReset(){
  try {
    const p = new URLSearchParams(location.search);
    if (p.get('reiniciar') === CONFIG.adminKey) {
      localStorage.removeItem(CONFIG.storageKey); STATE = defaultState();
      history.replaceState(null, '', location.pathname);
      setTimeout(() => toast(ICON.checkC + ' Progreso reiniciado en este navegador.'), 300);
    }
  } catch (e) {}
})();


/* Navegación interna: no depende de que el visor permita cambiar la dirección
   (algunos visores incrustados lo bloquean). Si se puede, actualiza el #hash
   para que funcionen los botones atrás/adelante del navegador. */
let CUR = location.hash || '#/';
function go(h){
  CUR = h;
  try { if (location.hash !== h) location.hash = h; } catch (e) {}
  route();
}

/* ------------------------- ENRUTADOR (hash) -------------------------
   Sin registro → formulario de registro.
   #/              → tablero
   #/modulo/N[/S]  → módulo N, sección S (bloqueado si no corresponde o si el reto ya inició)
   #/reto          → introducción, pregunta en curso o resultados, según el estado
   -------------------------------------------------------------------- */
function route(){
  const parts = CUR.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (!STATE.user) { renderRegister(); }
  else if (parts[0] === 'modulo') {
    const i = parseInt(parts[1], 10) - 1, s = parts[2] ? parseInt(parts[2], 10) - 1 : 0;
    if (isNaN(i) || !MODULES[i]) { go('#/'); return; }
    if (quizStarted()) { toast(ICON.lock + ' Los módulos se cerraron al iniciar el reto final.'); go('#/reto'); return; }
    if (!isUnlocked(i)) { toast(ICON.lock + ' Ese módulo aún está bloqueado.'); go('#/'); return; }
    renderModule(i, isNaN(s) ? 0 : s);
  } else if (parts[0] === 'reto') {
    if (!allDone()) { toast(ICON.lock + ' El reto final se habilita al completar los seis módulos.'); go('#/'); return; }
    if (STATE.finished) renderResults();
    else if (STATE.quiz) renderQuestion();
    else renderChallengeIntro();
  } else {
    renderDashboard();
  }
  app.focus({ preventScroll:true });
  window.scrollTo({ top:0 });
}
window.addEventListener('hashchange', () => { if (location.hash !== CUR) { CUR = location.hash || '#/'; route(); } });
applyProjection();
route();
/* Si quedó un envío pendiente (p. ej. sin internet), reintentar al abrir */
if (STATE.finished && STATE.finished.sent !== 'ok') sendResults();

</script>
